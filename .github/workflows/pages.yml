name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Lightweight results refresh every six hours during the football season.
    # Full model fitting stays on Body 1.
    - cron: '17 */6 * 8-12 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Refresh final scores and weekly comparisons
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/export_data.py 2026 SEC --refresh
      - name: Check model and results integrity
        run: python -m unittest discover -s tests -v
      - name: Build site
        env:
          SITE_ORIGIN: https://drlatham18.github.io/sec-ranking-model
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
