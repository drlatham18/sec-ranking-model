name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Results and in-season ratings refresh every day, year round, so the site
    # is never more than 24h stale even out of season. During the season the
    # six-hourly run picks up Saturday finals the same night. Model FITTING
    # (the preseason regression) still stays on Body 1; these runs only refresh
    # results and recompute the in-season blend from them.
    - cron: '20 11 * * *'        # daily ~07:20 ET, all year
    - cron: '17 */6 * 8-12 *'    # every six hours, Aug-Dec

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Refresh final scores and weekly comparisons
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/export_data.py 2026 SEC --refresh
      - name: Check model and results integrity
        run: python -m unittest discover -s tests -v
      - name: Build site
        env:
          SITE_ORIGIN: https://drlatham18.github.io/sec-ranking-model
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # A failed scheduled refresh is otherwise invisible: the previously
      # deployed site stays up and simply goes stale. Raise it where it will be
      # noticed instead of waiting for someone to spot old scores.
      - name: Report a broken refresh
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled results refresh is failing';
            const body = [
              `The scheduled Pages refresh failed on ${new Date().toISOString()}.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The published site keeps serving the last good data and shows its',
              'stale-results notice, so nothing is broken for visitors -- but the',
              'scores stop advancing until this is fixed.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'refresh-failure', per_page: 1,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['refresh-failure'],
              });
            }
